      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500..800&family=Schibsted+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <title>Nicolas Huber · makes messy data behave</title>

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
